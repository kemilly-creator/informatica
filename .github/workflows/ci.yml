name: Universo IF Avalia CI
on:
  push:
    branches: [feat/universo-if-avalia-mvp]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate 46-project catalog
        run: node scripts/validar-catalogo.mjs
      - name: Check Apps Script syntax
        run: npm run check:apps-script
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
