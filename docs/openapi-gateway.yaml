openapi: 3.1.0
info:
  title: Informatica Automation Gateway
  version: 1.0.0
  description: Esquema-base para um gateway autenticado; não aponta diretamente para o Apps Script.
servers:
  - url: https://SEU-GATEWAY.example.com
paths:
  /action:
    post:
      operationId: executarAcaoPermitida
      summary: Executa uma operação explicitamente permitida
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [ping, getScriptInfo, listSheets, readRange, appendRow]
                args:
                  type: object
      responses:
        "200":
          description: Resultado da operação
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  result: {}
        "401":
          description: Não autorizado
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
